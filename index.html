<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diell's Vocab Quest</title>
<style>
  :root { --red:#c8102e; --green:#046a38; --gold:#f4c430; --grey:#5b6070; --purple:#6b3fa0; --ink:#14213d; --paper:#fffdf5; --line:#e4dcc4; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Trebuchet MS", "Segoe UI", sans-serif; background:var(--paper); color:var(--ink); }
  header { display:flex; align-items:center; gap:12px; padding:12px 16px; background:linear-gradient(90deg,var(--green) 0 40%,var(--red) 40% 100%); color:#fff; }
  header h1 { font-size:20px; margin:0; flex:1; }
  button { font:inherit; cursor:pointer; border:0; border-radius:12px; padding:10px 16px; background:var(--ink); color:#fff; }
  button.ghost { background:#fff; color:var(--ink); border:2px solid var(--ink); }
  button:disabled { opacity:.4; cursor:default; }
  main { max-width:1200px; margin:0 auto; padding:16px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px; }
  .scene-card { border:3px solid var(--ink); border-radius:16px; padding:16px; background:#fff; text-align:left; color:var(--ink); min-height:120px; }
  .scene-card b { display:block; font-size:18px; margin-bottom:6px; }
  .layout { display:grid; grid-template-columns:minmax(0,2fr) minmax(260px,1fr); gap:16px; }
  @media (max-width:800px) { .layout { grid-template-columns:1fr; } }
  .stage { position:relative; border:3px solid var(--ink); border-radius:16px; overflow:hidden; background:#dfe8d8; }
  .cam { position:absolute; top:0; left:0; width:100%; height:100%; transform-origin:0 0; transition:transform 1s ease-in-out; }
  .cam img.base { position:absolute; top:0; left:0; width:100%; height:100%; display:block; }
  .cam img.lay { position:absolute; opacity:0; pointer-events:none; }
  .cam img.lay.on, .cam img.lay.go { opacity:1; }
  .cam img.lay.go { animation-duration:1.1s; animation-timing-function:ease-out; animation-fill-mode:both; }
  .stage .missing { position:absolute; left:8px; right:8px; top:8px; z-index:3; margin:0; padding:6px 10px; border-radius:8px; background:rgba(255,253,245,.9); pointer-events:none; }
  .reveal-circle .lay.go { animation-name:rv-circle; }
  .reveal-brush .lay.go { animation-name:rv-brush; }
  .reveal-burst .lay.go { animation-name:rv-burst; }
  .reveal-blur .lay.go, .reveal-spotlight .lay.go { animation-name:rv-blur; }
  .reveal-ink .lay.go { animation-name:rv-ink; -webkit-mask-image:radial-gradient(circle, #000 35%, rgba(0,0,0,.6) 45%, transparent 60%); mask-image:radial-gradient(circle, #000 35%, rgba(0,0,0,.6) 45%, transparent 60%); -webkit-mask-position:center; mask-position:center; -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat; }
  @keyframes rv-circle { from { -webkit-clip-path:circle(0% at 50% 50%); clip-path:circle(0% at 50% 50%); } to { -webkit-clip-path:circle(75% at 50% 50%); clip-path:circle(75% at 50% 50%); } }
  @keyframes rv-brush { from { -webkit-clip-path:inset(0 100% 0 0); clip-path:inset(0 100% 0 0); } to { -webkit-clip-path:inset(0 0 0 0); clip-path:inset(0 0 0 0); } }
  @keyframes rv-burst {
    from { -webkit-clip-path:polygon(50.0% 48.0%, 50.4% 49.0%, 51.4% 48.6%, 51.0% 49.6%, 52.0% 50.0%, 51.0% 50.4%, 51.4% 51.4%, 50.4% 51.0%, 50.0% 52.0%, 49.6% 51.0%, 48.6% 51.4%, 49.0% 50.4%, 48.0% 50.0%, 49.0% 49.6%, 48.6% 48.6%, 49.6% 49.0%); clip-path:polygon(50.0% 48.0%, 50.4% 49.0%, 51.4% 48.6%, 51.0% 49.6%, 52.0% 50.0%, 51.0% 50.4%, 51.4% 51.4%, 50.4% 51.0%, 50.0% 52.0%, 49.6% 51.0%, 48.6% 51.4%, 49.0% 50.4%, 48.0% 50.0%, 49.0% 49.6%, 48.6% 48.6%, 49.6% 49.0%); }
    to { -webkit-clip-path:polygon(50.0% -110.0%, 83.7% -31.3%, 163.1% -63.1%, 131.3% 16.3%, 210.0% 50.0%, 131.3% 83.7%, 163.1% 163.1%, 83.7% 131.3%, 50.0% 210.0%, 16.3% 131.3%, -63.1% 163.1%, -31.3% 83.7%, -110.0% 50.0%, -31.3% 16.3%, -63.1% -63.1%, 16.3% -31.3%); clip-path:polygon(50.0% -110.0%, 83.7% -31.3%, 163.1% -63.1%, 131.3% 16.3%, 210.0% 50.0%, 131.3% 83.7%, 163.1% 163.1%, 83.7% 131.3%, 50.0% 210.0%, 16.3% 131.3%, -63.1% 163.1%, -31.3% 83.7%, -110.0% 50.0%, -31.3% 16.3%, -63.1% -63.1%, 16.3% -31.3%); }
  }
  @keyframes rv-blur { from { opacity:0; -webkit-filter:blur(14px); filter:blur(14px); } to { opacity:1; -webkit-filter:blur(0); filter:blur(0); } }
  @keyframes rv-ink { from { -webkit-mask-size:0% 0%; mask-size:0% 0%; } to { -webkit-mask-size:300% 300%; mask-size:300% 300%; } }
  .dim { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; opacity:0; z-index:1; }
  .dim.go { animation:dim 2.6s ease-in-out both; }
  @keyframes dim { 0% { opacity:0; } 25%, 70% { opacity:1; } 100% { opacity:0; } }
  @supports not ((clip-path: circle(1%)) or (-webkit-clip-path: circle(1%))) {
    .reveal-circle .lay.go, .reveal-brush .lay.go, .reveal-burst .lay.go { animation-name:rv-blur; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cam { transition:none; }
    .cam img.lay.go { animation:none; }
    .dim.go, .spot.reveal { animation:none; }
  }
  .spot { position:absolute; z-index:2; transform:translate(-50%,-50%); border-radius:50%; padding:0; background:transparent; height:0; }
  .stage.explore .spot::after { content:attr(data-n); position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:28px; height:28px; line-height:28px; border-radius:50%; background:var(--gold); color:var(--ink); font-weight:bold; border:2px solid var(--ink); }
  .stage.recall .spot { cursor:default; }
  .spot.active { box-shadow:0 0 0 4px var(--gold); animation:pulse 1.2s infinite; }
  .spot.reveal { animation:reveal 2.5s ease-out .4s forwards; }
  .spot.right { box-shadow:0 0 0 5px var(--green); }
  .spot.wrong { box-shadow:0 0 0 5px var(--red); }
  @keyframes pulse { 50% { box-shadow:0 0 0 10px var(--gold); } }
  @keyframes reveal {
    0% { box-shadow:0 0 0 0 rgba(244,196,48,0); }
    25% { box-shadow:0 0 18px 8px rgba(244,196,48,.9); }
    55% { box-shadow:0 0 14px 5px rgba(244,196,48,.4); }
    100% { box-shadow:0 0 0 0 rgba(244,196,48,0); }
  }
  .panel { border:3px solid var(--ink); border-radius:16px; padding:16px; background:#fff; display:flex; flex-direction:column; gap:12px; }
  .tabs { display:flex; gap:8px; }
  .tabs button { flex:1; padding:8px; }
  .tabs button[aria-pressed="false"] { background:#fff; color:var(--ink); border:2px solid var(--ink); }
  .word { font-size:28px; font-weight:bold; margin:0; }
  .chip { display:inline-block; padding:4px 12px; border-radius:999px; color:#fff; font-weight:bold; margin:2px 4px 2px 0; }
  .chip.syn { background:linear-gradient(90deg,var(--green),var(--red)); }
  .chip.ant { background:linear-gradient(90deg,var(--grey),var(--purple)); }
  .story { font-size:17px; line-height:1.5; margin:0; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .opts { display:grid; gap:8px; }
  .opts button { background:#fff; color:var(--ink); border:2px solid var(--ink); text-align:left; }
  .opts button.right { background:var(--gold); color:var(--ink); font-weight:bold; }
  .opts button.right::before { content:"\2713  "; }
  .opts button.wrong { border-style:dashed; text-decoration:line-through; opacity:.7; }
  .opts button.wrong::before { content:"\2717  "; }
  .opts.syn button { border-left:10px solid var(--green); border-right:10px solid var(--red); }
  .opts.ant button { border-left:10px solid var(--grey); border-right:10px solid var(--purple); }
  .score { font-weight:bold; }
  .muted { color:var(--grey); font-size:14px; }
  .sentence { font-size:20px; line-height:1.5; margin:0; padding:10px 14px; background:#fff8dc; border-radius:12px; }
  .sentence b { color:var(--purple); }
  .chip.mean { background:linear-gradient(90deg,var(--ink),#3a5a9a); }
  .today { margin-bottom:16px; }
</style>
</head>
<body>
<header>
  <h1>Diell's Vocab Quest</h1>
  <button class="ghost" id="homeBtn" hidden>Home</button>
</header>
<main id="app"><p id="boot" class="muted">Loading. If this message stays, open this file in Safari or Chrome on a computer, not in a preview window.</p></main>

<script>
window.onerror = function (msg, src, line) {
  var box = document.getElementById('app');
  var p = document.createElement('p');
  p.className = 'muted';
  p.textContent = 'Sorry, something went wrong. Please send this line to your tutor: ' + msg + ' (line ' + line + ')';
  box.appendChild(p);
};
[Element.prototype, Document.prototype, DocumentFragment.prototype].forEach(function (proto) {
  if (proto.replaceChildren) return;
  proto.replaceChildren = function () {
    while (this.lastChild) this.removeChild(this.lastChild);
    for (var i = 0; i < arguments.length; i++) {
      var n = arguments[i];
      this.appendChild(typeof n === 'string' ? document.createTextNode(n) : n);
    }
  };
});
</script>
<script src="scenes.js"></script>
<script src="quiz-core.js"></script>
<script src="stage-core.js"></script>
<script>
(function () {
  const KEY = 'vocabQuest.v2';
  const OLD_KEY = 'vocabQuest.v1';
  const scenes = window.SCENES;
  const Q = window.QuizCore;
  const S = window.StageCore;
  const today = Q.dayNumber(new Date());
  const app = document.getElementById('app');
  const homeBtn = document.getElementById('homeBtn');
  const audio = new Audio();
  let progress = Q.loadProgress(readStore(), today);

  function readStore() { try { return localStorage.getItem(KEY) || localStorage.getItem(OLD_KEY); } catch (e) { return null; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(progress)); } catch (e) { /* storage unavailable */ } }
  // Plays the narration clip; if the clip is missing, the device reads the text aloud instead.
  function speak(text) {
    if (!window.speechSynthesis || !text) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = S.pickVoice(speechSynthesis.getVoices());
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-GB';
    u.rate = 0.95;
    speechSynthesis.speak(u);
  }
  function play(name, text) {
    audio.pause();
    if (window.speechSynthesis) speechSynthesis.cancel();
    audio.onerror = function () { speak(text); };
    audio.src = 'audio/' + name + '.mp3';
    audio.play().catch(function () {});
  }
  let timers = [];
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  function stop() { audio.pause(); audio.onerror = null; if (window.speechSynthesis) speechSynthesis.cancel(); clearTimers(); }

  // Fixed base picture plus one layer per word. Only layers ever change, so nothing else moves.
  function buildStage(scene, mode) {
    const stage = el('div', { class: 'stage ' + mode + ' reveal-' + scene.reveal });
    const ratio = scene.aspect.split(':').map(Number);
    if (window.CSS && CSS.supports && CSS.supports('aspect-ratio', '1 / 1')) stage.style.aspectRatio = ratio[0] + ' / ' + ratio[1];
    else { stage.style.height = '0'; stage.style.paddingTop = (ratio[1] / ratio[0] * 100) + '%'; }
    const cam = el('div', { class: 'cam' });
    const base = el('img', { class: 'base', alt: scene.title + ' scene', src: scene.base });
    base.addEventListener('error', function () { stage.append(el('p', { class: 'muted missing', text: 'Picture missing: ' + scene.base })); });
    cam.append(base);
    const lays = {};
    const spots = {};
    scene.words.forEach(function (w) {
      const L = w.layer;
      lays[w.id] = el('img', { class: 'lay', alt: '', src: L.src, style: 'left:' + L.left + '%;top:' + L.top + '%;width:' + L.width + '%;height:' + L.height + '%' });
      cam.append(lays[w.id]);
    });
    const dim = el('div', { class: 'dim' });
    cam.append(dim);
    scene.words.forEach(function (w, n) {
      const b = el('button', { class: 'spot', 'data-n': n + 1, 'aria-label': mode === 'recall' ? 'picture clue' : w.symbol, style: 'left:' + w.x + '%;top:' + w.y + '%;width:' + (w.r * 2) + '%;padding-bottom:' + (w.r * 2) + '%' });
      spots[w.id] = b;
      cam.append(b);
    });
    stage.append(cam);
    return { stage: stage, cam: cam, lays: lays, spots: spots, dim: dim };
  }
  function el(tag, attrs, kids) {
    const n = document.createElement(tag);
    for (const k in attrs || {}) {
      if (k === 'text') n.textContent = attrs[k];
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== false && attrs[k] != null) n.setAttribute(k, attrs[k] === true ? '' : attrs[k]);
    }
    for (const c of kids || []) n.append(c);
    return n;
  }

  homeBtn.addEventListener('click', home);

  function home() {
    stop();
    homeBtn.hidden = true;
    const due = Q.dueWords(scenes, progress, today).length;
    const next = Q.nextLesson(scenes, progress);
    const learned = Object.keys(progress.words).filter(function (id) { return progress.words[id].box > 0; }).length;
    const strong = Object.keys(progress.words).filter(function (id) { return progress.words[id].box >= 3; }).length;
    const total = scenes.reduce(function (n, s) { return n + s.words.length; }, 0);
    const todayKids = [el('p', { class: 'word', text: 'Today' })];
    todayKids.push(due
      ? el('button', { text: 'Start review (' + due + ' words)', onclick: runReview })
      : el('p', { class: 'story', text: 'No reviews due. Great job!' }));
    if (next >= 0) {
      todayKids.push(Q.newLessonDoneToday(progress, today)
        ? el('p', { class: 'muted', text: 'Next new lesson tomorrow: ' + (next + 1) + '. ' + scenes[next].title + '. Sleep helps new words stick.' })
        : el('button', { class: 'ghost', text: 'New lesson: ' + (next + 1) + '. ' + scenes[next].title, onclick: function () { openScene(next); } }));
    }
    todayKids.push(el('p', { class: 'muted', text: learned + ' of ' + total + ' words started, ' + strong + ' strong' }));
    const cards = scenes.map(function (s, i) {
      const done = progress.scenes[s.id];
      return el('button', { class: 'scene-card', onclick: function () { openScene(i); } },
        [el('b', { text: (i + 1) + '. ' + s.title }), el('span', { text: done ? 'Best: ' + done.best + ' / ' + done.total + ' goals' : 'Ready to play' })]);
    });
    app.replaceChildren(el('div', { class: 'panel today' }, todayKids), el('p', { class: 'muted', text: 'All lessons' }), el('div', { class: 'cards' }, cards));
  }

  function openScene(index) {
    homeBtn.hidden = false;
    runScene(index, 'watch');
  }

  // "The *eerie* house" -> text with <b>eerie</b>; gaps stay as typed.
  function sentenceNode(text) {
    const p = el('p', { class: 'sentence' });
    text.split(/\*([^*]+)\*/).forEach(function (part, i) { p.append(i % 2 ? el('b', { text: part }) : part); });
    return p;
  }

  const CHIP = { synonym: ['syn', 'Same meaning'], antonym: ['ant', 'Opposite meaning'], meaning: ['mean', 'Meaning'], context: ['mean', 'Word in a sentence'], cloze: ['mean', 'Fill the gap'], twins: ['mean', 'Twins'] };
  function choiceBlock(q, onAnswer) {
    const chip = CHIP[q.type];
    let locked = false;
    const feedback = el('p', { class: 'story' });
    const next = el('button', { text: 'Next', hidden: true });
    const buttons = q.options.map(function (opt) {
      return el('button', { text: opt, onclick: function (ev) {
        if (locked) return;
        locked = true;
        const ok = opt === q.answer;
        ev.currentTarget.classList.add(ok ? 'right' : 'wrong');
        buttons.forEach(function (b) { if (b.textContent === q.answer) b.classList.add('right'); });
        if (ok) feedback.textContent = 'Goal!';
        else if (q.opposite && opt === q.opposite) feedback.textContent = 'That is the opposite! "' + q.word + '" means ' + q.answer + '.';
        else if (q.type === 'twins') feedback.textContent = 'Careful, twins! "' + q.answer + '" fits here, not "' + opt + '".';
        else feedback.textContent = 'Not this time. The answer is "' + q.answer + '".';
        next.hidden = false;
        next.dataset.ok = ok ? '1' : '0';
        onAnswer(ok);
      } });
    });
    const nodes = [el('span', { class: 'chip ' + chip[0], text: chip[1] })];
    if (q.sentence) nodes.push(sentenceNode(q.sentence));
    nodes.push(el('p', { class: 'story', text: q.prompt }), el('div', { class: 'opts ' + chip[0] }, buttons), feedback, next);
    return { nodes: nodes, next: next };
  }

  function runReview() {
    stop();
    homeBtn.hidden = false;
    const pool = scenes.flatMap(function (s) { return s.words; });
    const session = Q.createSession(Q.buildSession(scenes, progress, today, Math.random), pool);
    let firstRight = 0;
    let firstTotal = 0;
    function show() {
      if (session.i >= session.queue.length) {
        app.replaceChildren(el('div', { class: 'panel' }, [el('p', { class: 'word', text: 'Review done!' }),
          el('p', { class: 'score', text: firstRight + ' of ' + firstTotal + ' right first time' }),
          el('button', { text: 'Back to Today', onclick: home })]));
        return;
      }
      const q = session.queue[session.i];
      const block = choiceBlock(q, function (ok) {
        const first = Q.answerSession(session, ok, Math.random);
        if (first) { Q.review(progress, q.wordId, ok, today); firstTotal += 1; if (ok) firstRight += 1; save(); }
      });
      block.next.onclick = show;
      app.replaceChildren(el('div', { class: 'panel' }, [el('p', { class: 'word', text: 'Review' }),
        el('p', { class: 'muted', text: 'Question ' + (session.i + 1) + ' of ' + session.queue.length })].concat(block.nodes)));
    }
    show();
  }

  function runScene(index, mode) {
    const scene = scenes[index];
    stop();
    const view = buildStage(scene, mode);
    const stage = view.stage;
    const spots = view.spots;
    Object.keys(spots).forEach(function (id) {
      const w = scene.words.find(function (x) { return x.id === id; });
      spots[id].addEventListener('click', function () { onSpot(w); });
    });
    function showUpTo(count, animateLast) {
      scene.words.forEach(function (w, i) {
        view.lays[w.id].className = 'lay' + (i < count - (animateLast ? 1 : 0) ? ' on' : '') + (animateLast && i === count - 1 ? ' go' : '');
      });
    }
    function spotlight(w) {
      view.dim.style.background = 'radial-gradient(circle at ' + w.x + '% ' + w.y + '%, transparent ' + (w.r * 1.3) + '%, rgba(20,33,61,.55) ' + (w.r * 1.3 + 8) + '%)';
      view.dim.classList.remove('go');
      void view.dim.offsetWidth;
      view.dim.classList.add('go');
    }
    const body = el('div');
    const tabs = el('div', { class: 'tabs' }, ['watch', 'explore', 'recall'].map(function (m) {
      return el('button', { text: m.charAt(0).toUpperCase() + m.slice(1), 'aria-pressed': String(m === mode), onclick: function () { stop(); runScene(index, m); } });
    }));
    const panel = el('div', { class: 'panel' }, [el('p', { class: 'muted', text: scene.title }), tabs, body]);
    app.replaceChildren(el('div', { class: 'layout' }, [stage, panel]));
    let onSpot = function () {};

    function clearMarks() { Object.values(spots).forEach(function (s) { s.classList.remove('active', 'reveal', 'right', 'wrong'); }); }
    function card(w) {
      return [el('p', { class: 'word', text: w.word }), el('p', { class: 'story', text: w.meaning }),
        el('div', {}, [el('span', { class: 'chip syn', text: 'Same: ' + w.synonym })].concat(w.antonym ? [el('span', { class: 'chip ant', text: 'Opposite: ' + w.antonym })] : []))];
    }

    if (mode === 'watch') {
      let step = 0;
      const total = scene.words.length;
      function show() {
        clearTimers();
        clearMarks();
        const w = step === 0 ? null : scene.words[step - 1];
        if (w) spots[w.id].classList.add('reveal');
        showUpTo(step - 1, false);
        view.cam.style.transform = '';
        if (w) {
          view.cam.style.transform = S.transformFor(w.x, w.y, S.zoomFor(w.r));
          later(function () { showUpTo(step, true); if (scene.reveal === 'spotlight') spotlight(w); }, 700);
          later(function () { view.cam.style.transform = ''; }, 4200);
        }
        play(w ? w.id : scene.id + '_intro', w ? w.story : scene.intro);
        body.replaceChildren.apply(body, (w ? card(w) : [el('p', { class: 'word', text: scene.title })]).concat([
          el('p', { class: 'story', text: w ? w.story : scene.intro }),
          el('p', { class: 'muted', text: 'Step ' + step + ' of ' + total }),
          el('div', { class: 'row' }, [
            el('button', { class: 'ghost', text: 'Back', disabled: step === 0, onclick: function () { step -= 1; show(); } }),
            el('button', { class: 'ghost', text: 'Replay', onclick: function () { play(w ? w.id : scene.id + '_intro', w ? w.story : scene.intro); } }),
            step < total
              ? el('button', { text: 'Next', onclick: function () { step += 1; show(); } })
              : el('button', { text: 'Go to Explore', onclick: function () { stop(); runScene(index, 'explore'); } }),
          ]),
        ]));
      }
      show();
    }

    if (mode !== 'watch') showUpTo(scene.words.length, false);

    if (mode === 'explore') {
      body.replaceChildren(el('p', { class: 'story', text: 'Tap any numbered clue in the picture.' }));
      onSpot = function (w) {
        clearMarks();
        spots[w.id].classList.add('active');
        play(w.id, w.story);
        body.replaceChildren.apply(body, card(w).concat([el('p', { class: 'story', text: w.story })]));
      };
    }

    if (mode === 'recall') {
      const questions = Q.makeQuestions(scene, scenes, Math.random);
      let i = 0;
      let score = 0;
      function finish() {
        Q.finishLesson(progress, scene, score, questions.length, today);
        save();
        onSpot = function () {};
        clearMarks();
        body.replaceChildren(el('p', { class: 'word', text: 'Full time!' }), el('p', { class: 'score', text: score + ' / ' + questions.length + ' goals' }),
          el('div', { class: 'row' }, [el('button', { text: 'Play again', onclick: function () { runScene(index, 'recall'); } }), el('button', { class: 'ghost', text: 'Home', onclick: home })]));
      }
      function show() {
        clearMarks();
        if (i >= questions.length) { finish(); return; }
        const q = questions[i];
        const head = el('p', { class: 'muted', text: 'Question ' + (i + 1) + ' of ' + questions.length + '   Goals: ' + score });
        if (q.type === 'find') {
          let locked = false;
          const feedback = el('p', { class: 'story' });
          const next = el('button', { text: 'Next', hidden: true, onclick: function () { i += 1; show(); } });
          onSpot = function (w) {
            if (locked) return;
            locked = true;
            const ok = w.id === q.answer;
            if (ok) score += 1;
            Q.recordAnswer(progress, q.wordId, ok);
            save();
            spots[w.id].classList.add(ok ? 'right' : 'wrong');
            spots[q.answer].classList.add('right');
            feedback.textContent = ok ? 'Goal!' : 'Not this time. The right clue is circled in green.';
            next.hidden = false;
          };
          body.replaceChildren(head, el('p', { class: 'story', text: q.prompt }), feedback, next);
        } else {
          onSpot = function () {};
          const block = choiceBlock(q, function (ok) { if (ok) score += 1; Q.recordAnswer(progress, q.wordId, ok); save(); });
          block.next.onclick = function () { i += 1; show(); };
          body.replaceChildren.apply(body, [head].concat(block.nodes));
        }
      }
      show();
    }
  }

  home();
})();
</script>
</body>
</html>
